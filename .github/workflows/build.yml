name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # auto-patch.yml goi lai workflow nay de build + phat hanh (tag do GITHUB_TOKEN tao khong kich hoat workflow)
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      RELEASES_TOKEN:
        required: false

permissions:
  contents: read

env:
  # Repo public chua Release; phai trung updater.RELEASES_REPO (test_updater kiem)
  RELEASES_REPO: thientrile/MasterDownloader-releases
  # Tag can phat hanh: tu auto-patch, hoac tag v* vua push; rong = build thu, khong phat hanh
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Set version from tag
        if: env.TAG != ''
        shell: bash
        run: printf '__version__ = "%s"\n' "${TAG#v}" > version.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name MasterDownloader --collect-submodules gallery_dl App.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = if ($env:TAG) { $env:TAG.Substring(1) } else { '0.0.0-dev' }
          & $iscc "/DAppVersion=$v" installer.iss

      # Cai/go that tren runner: kiem duong dan per-user, unins000.exe (updater dung de nhan ban cai) va giu %APPDATA%
      - name: Smoke test installer
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\MasterDownloader"
          Start-Process dist\MasterDownloader-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          if (-not (Test-Path "$app\MasterDownloader.exe") -or -not (Test-Path "$app\unins000.exe")) { throw "install failed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MasterDownloader\MasterDownloader.lnk")) { throw "no Start Menu shortcut" }
          $data = "$env:APPDATA\MasterDownloader"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\keep.txt" "x"
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          # Uninstaller tu chep sang %TEMP% roi chay tiep, nen doi file bien mat
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\MasterDownloader.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\MasterDownloader.exe") { throw "uninstall failed" }
          if (-not (Test-Path "$data\keep.txt")) { throw "uninstall deleted user data" }

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum MasterDownloader.exe MasterDownloader-Setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Version yt-dlp/gallery-dl da dong goi; auto-patch so voi PyPI
      - name: Record library versions
        run: python tools/dep_check.py --write dist/versions.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MasterDownloader-windows
          path: |
            dist/MasterDownloader.exe
            dist/MasterDownloader-Setup.exe
            dist/SHA256SUMS.txt
            dist/versions.txt

  release:
    needs: windows
    if: inputs.tag || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Chi job nay co quyen ghi; khong cai/chay code ben thu ba o day
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MasterDownloader-windows
          path: dist

      # Chay truoc: thieu secret thi fail khi chua phat hanh gi, chay lai job khong vuong release da ton tai
      - name: Release (public releases repo)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Secret RELEASES_TOKEN chua duoc dat; khong the tao Release o $RELEASES_REPO"
            exit 1
          fi
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          # --generate-notes can lich su git cua chinh repo dich (repo releases khong co code), nen dung --notes
          gh release create "$TAG" dist/MasterDownloader.exe dist/MasterDownloader-Setup.exe dist/SHA256SUMS.txt dist/versions.txt \
            --repo "$RELEASES_REPO" --title "$TAG" \
            --notes "MasterDownloader $TAG. Kiem tra SHA256 theo SHA256SUMS.txt." "${flags[@]}"

      # Repo goc: ban v1.0.0/v1.0.1 dang cai van hoi releases/latest o day
      - name: Release (source repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/MasterDownloader.exe dist/MasterDownloader-Setup.exe dist/SHA256SUMS.txt dist/versions.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${flags[@]}"
