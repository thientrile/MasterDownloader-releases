name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # auto-patch.yml goi lai workflow nay de build + phat hanh (tag do GITHUB_TOKEN tao khong kich hoat workflow)
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      # Tag cua Release truoc: build lai dung ma nguon do, ghim goi theo versions.txt cua no
      base:
        type: string
        default: ""
      # "yt-dlp==A gallery-dl==B": hai goi duy nhat duoc nang
      pins:
        type: string
        default: ""

permissions:
  contents: read

env:
  # Tag can phat hanh: tu auto-patch, hoac tag v* vua push; rong = build thu, khong phat hanh
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.src.outputs.sha }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}

      - id: src
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          PINS: ${{ inputs.pins }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$BASE" ]]; then
            python -m pip install -r requirements.txt
            exit 0
          fi
          [[ "$PINS" =~ ^yt-dlp==[A-Za-z0-9.]+\ gallery-dl==[A-Za-z0-9.]+$ ]] || { echo "::error::pins khong hop le: $PINS"; exit 1; }
          gh release download "$BASE" --repo "$GITHUB_REPOSITORY" --pattern versions.txt --dir old
          grep -vE '^(yt-dlp|gallery-dl)==' old/versions.txt > constraints.txt
          python -m pip install -r requirements.txt -c constraints.txt $PINS

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Set version from tag
        if: env.TAG != ''
        shell: bash
        run: printf '__version__ = "%s"\n' "${TAG#v}" > version.py

      # Doc tu moi truong build that (cac goi vua pip install + ban ffmpeg dong goi)
      - name: Third-party licenses
        shell: bash
        run: |
          mkdir -p dist
          python tools/third_party_licenses.py dist/THIRD_PARTY_LICENSES.txt
          cp LICENSE dist/LICENSE.txt
          cp DISCLAIMER.txt .github/release-notes.md dist/

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name MasterDownloader --collect-submodules gallery_dl --add-data "LICENSE;." --add-data "DISCLAIMER.txt;." --add-data "dist/THIRD_PARTY_LICENSES.txt;." App.py

      # Exe da dong goi phai chay duoc gallery-dl/yt-dlp ben trong va dung ban vua cai
      - name: Smoke test exe
        # exe treo (vd. mo GUI thay vi chay lenh) thi do sau 5 phut, khong doi 6 gio
        timeout-minutes: 5
        shell: bash
        run: |
          check() {
            got=$(dist/MasterDownloader.exe "$1" --version | tr -d '\r')
            want=$(python -c "import $2.version as v; print(v.__version__)")
            echo "$1: $got (expected $want)"
            [[ "$got" == "$want" ]]
          }
          check --gallery-dl gallery_dl
          check --yt-dlp yt_dlp

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = if ($env:TAG) { $env:TAG.Substring(1) } else { '0.0.0-dev' }
          & $iscc "/DAppVersion=$v" installer.iss

      # Cai/go that tren runner: kiem duong dan per-user, unins000.exe (updater dung de nhan ban cai) va giu %APPDATA%
      - name: Smoke test installer
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\MasterDownloader"
          Start-Process dist\MasterDownloader-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          foreach ($f in 'MasterDownloader.exe','unins000.exe','LICENSE.txt','DISCLAIMER.txt','THIRD_PARTY_LICENSES.txt') { if (-not (Test-Path "$app\$f")) { throw "install failed: $f missing" } }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MasterDownloader\MasterDownloader.lnk")) { throw "no Start Menu shortcut" }
          $data = "$env:APPDATA\MasterDownloader"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\keep.txt" "x"
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          # Uninstaller tu chep sang %TEMP% roi chay tiep, nen doi file bien mat
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\MasterDownloader.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\MasterDownloader.exe") { throw "uninstall failed" }
          if (-not (Test-Path "$data\keep.txt")) { throw "uninstall deleted user data" }

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum MasterDownloader.exe MasterDownloader-Setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Moi goi da dong goi: auto-patch so yt-dlp/gallery-dl voi PyPI va ghim cac goi con lai
      - name: Record library versions
        run: python tools/dep_check.py --write dist/versions.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MasterDownloader-windows
          path: |
            dist/MasterDownloader.exe
            dist/MasterDownloader-Setup.exe
            dist/SHA256SUMS.txt
            dist/versions.txt
            dist/THIRD_PARTY_LICENSES.txt
            dist/LICENSE.txt
            dist/DISCLAIMER.txt
            dist/release-notes.md

  release:
    needs: windows
    if: inputs.tag || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Chi job nay co quyen ghi; khong cai/chay code ben thu ba o day
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MasterDownloader-windows
          path: dist

      - name: Release notes
        run: sed "s/{{TAG}}/$TAG/g" dist/release-notes.md > notes.md

      # Repo nay (MasterDownloader-releases) vua chua ma nguon vua la noi updater doc releases/latest
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Commit da build (auto-patch: commit cua Release truoc, khong phai HEAD main)
          SHA: ${{ needs.windows.outputs.sha }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/MasterDownloader.exe dist/MasterDownloader-Setup.exe dist/SHA256SUMS.txt dist/THIRD_PARTY_LICENSES.txt dist/LICENSE.txt dist/DISCLAIMER.txt dist/versions.txt \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --notes-file notes.md --generate-notes "${flags[@]}"
