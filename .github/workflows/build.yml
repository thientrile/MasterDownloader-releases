name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Repo public chua Release; phai trung updater.RELEASES_REPO (test_updater kiem)
  RELEASES_REPO: thientrile/MasterDownloader-releases

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: printf '__version__ = "%s"\n' "${GITHUB_REF_NAME#v}" > version.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name MasterDownloader --collect-submodules gallery_dl App.py

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum MasterDownloader.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MasterDownloader-windows
          path: |
            dist/MasterDownloader.exe
            dist/SHA256SUMS.txt

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Chi job nay co quyen ghi; khong cai/chay code ben thu ba o day
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MasterDownloader-windows
          path: dist

      # Chay truoc: thieu secret thi fail khi chua phat hanh gi, chay lai job khong vuong release da ton tai
      - name: Release (public releases repo)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Secret RELEASES_TOKEN chua duoc dat; khong the tao Release o $RELEASES_REPO"
            exit 1
          fi
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          # --generate-notes can lich su git cua chinh repo dich (repo releases khong co code), nen dung --notes
          gh release create "$GITHUB_REF_NAME" dist/MasterDownloader.exe dist/SHA256SUMS.txt \
            --repo "$RELEASES_REPO" --title "$GITHUB_REF_NAME" \
            --notes "MasterDownloader $GITHUB_REF_NAME. Kiem tra SHA256 theo SHA256SUMS.txt." "${flags[@]}"

      # Repo goc: ban v1.0.0/v1.0.1 dang cai van hoi releases/latest o day
      - name: Release (source repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/MasterDownloader.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
