name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Repo public chua Release; phai trung updater.RELEASES_REPO (test_updater kiem)
  RELEASES_REPO: thientrile/MasterDownloader-releases

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: printf '__version__ = "%s"\n' "${GITHUB_REF_NAME#v}" > version.py

      # Doc tu moi truong build that (cac goi vua pip install + ban ffmpeg dong goi)
      - name: Third-party licenses
        shell: bash
        run: |
          mkdir -p dist
          python tools/third_party_licenses.py dist/THIRD_PARTY_LICENSES.txt
          cp LICENSE dist/LICENSE.txt
          cp DISCLAIMER.txt .github/release-notes.md dist/

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name MasterDownloader --collect-submodules gallery_dl --add-data "LICENSE;." --add-data "DISCLAIMER.txt;." --add-data "dist/THIRD_PARTY_LICENSES.txt;." App.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-dev' }
          & $iscc "/DAppVersion=$v" installer.iss

      # Cai/go that tren runner: kiem duong dan per-user, unins000.exe (updater dung de nhan ban cai) va giu %APPDATA%
      - name: Smoke test installer
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\MasterDownloader"
          Start-Process dist\MasterDownloader-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          foreach ($f in 'MasterDownloader.exe','unins000.exe','LICENSE.txt','DISCLAIMER.txt','THIRD_PARTY_LICENSES.txt') { if (-not (Test-Path "$app\$f")) { throw "install failed: $f missing" } }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MasterDownloader\MasterDownloader.lnk")) { throw "no Start Menu shortcut" }
          $data = "$env:APPDATA\MasterDownloader"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\keep.txt" "x"
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          # Uninstaller tu chep sang %TEMP% roi chay tiep, nen doi file bien mat
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\MasterDownloader.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\MasterDownloader.exe") { throw "uninstall failed" }
          if (-not (Test-Path "$data\keep.txt")) { throw "uninstall deleted user data" }

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum MasterDownloader.exe MasterDownloader-Setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MasterDownloader-windows
          path: |
            dist/MasterDownloader.exe
            dist/MasterDownloader-Setup.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_LICENSES.txt
            dist/LICENSE.txt
            dist/DISCLAIMER.txt
            dist/release-notes.md

  # Kiem RELEASES_TOKEN con ghi duoc repo releases ma khong phat hanh gi: tao roi xoa mot draft
  # (draft khong cong khai, khong tao tag). Token het han thi PR do, truoc khi tag that bi hong.
  releases-token:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Draft release round trip
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Secret RELEASES_TOKEN chua duoc dat"
            exit 1
          fi
          tag="token-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --repo "$RELEASES_REPO" --draft --title "CI token check" --notes "Tu xoa ngay"
          gh release delete "$tag" --repo "$RELEASES_REPO" --yes

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Chi job nay co quyen ghi; khong cai/chay code ben thu ba o day
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MasterDownloader-windows
          path: dist

      - name: Release notes
        run: sed "s/{{TAG}}/$GITHUB_REF_NAME/g" dist/release-notes.md > notes.md

      # Chay truoc: thieu secret thi fail khi chua phat hanh gi, chay lai job khong vuong release da ton tai
      - name: Release (public releases repo)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Secret RELEASES_TOKEN chua duoc dat; khong the tao Release o $RELEASES_REPO"
            exit 1
          fi
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          # Repo releases khong co code nen khong --generate-notes
          gh release create "$GITHUB_REF_NAME" dist/MasterDownloader.exe dist/MasterDownloader-Setup.exe dist/SHA256SUMS.txt dist/THIRD_PARTY_LICENSES.txt dist/LICENSE.txt dist/DISCLAIMER.txt \
            --repo "$RELEASES_REPO" --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"

      # Repo goc: ban v1.0.0/v1.0.1 dang cai van hoi releases/latest o day
      - name: Release (source repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/MasterDownloader.exe dist/MasterDownloader-Setup.exe dist/SHA256SUMS.txt dist/THIRD_PARTY_LICENSES.txt dist/LICENSE.txt dist/DISCLAIMER.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes "${flags[@]}"
